<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
  <title id="title">Arcanele XVIII, 0 și XVII</title>
  <desc id="desc">Trei cărți de Tarot fin ilustrate. The Fool este în centru, cu numere mici și discrete pe toate cărțile.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5d1c"/><stop offset=".5" stop-color="#d5b56d"/><stop offset="1" stop-color="#9a6924"/>
    </linearGradient>
    <radialGradient id="cardPaper" cx=".45" cy=".25" r=".85">
      <stop offset="0" stop-color="#fffef9"/><stop offset=".72" stop-color="#fbf1dd"/><stop offset="1" stop-color="#ead3a7"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#082f31" flood-opacity=".2"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="18" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComponentTransfer in="m" result="f"><feFuncA type="table" tableValues="0 .035"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="f" mode="multiply"/>
    </filter>
  </defs>

