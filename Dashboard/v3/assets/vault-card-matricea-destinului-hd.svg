<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
  <title id="title">Matricea Destinului</title>
  <desc id="desc">Diagramă circulară vectorială foarte detaliată, inspirată din Floarea Vieții, cu noduri, canale și ornament astral.</desc>
  <defs>
    <linearGradient id="gold" x1="72" y1="290" x2="402" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#8b5d1c"/><stop offset=".48" stop-color="#d7b86e"/><stop offset="1" stop-color="#966522"/></linearGradient>
    <radialGradient id="node" cx=".38" cy=".3" r=".82"><stop stop-color="#fffef8"/><stop offset=".76" stop-color="#fbf2df"/><stop offset="1" stop-color="#e9d09f"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#073f43" flood-opacity=".13"/></filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".84" numOctaves="2" seed="31" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="m"/><feComponentTransfer in="m" result="f"><feFuncA type="table" tableValues="0 .03"/></feComponentTransfer><feBlend in="SourceGraphic" in2="f" mode="multiply"/></filter>
  </defs>
  <g filter="url(#grain)" stroke-linecap="round" stroke-linejoin="round">
    <!-- aureole și ritm exterior -->
    <circle cx="240" cy="170" r="156" fill="none" stroke="#073f43" stroke-width="1.5" stroke-dasharray="2 8"/>
    <circle cx="240" cy="170" r="143" fill="none" stroke="#b98632" stroke-width="1" stroke-dasharray="25 8 2 8"/>
    <circle cx="240" cy="170" r="131" fill="none" stroke="#b98632" stroke-opacity=".48" stroke-width=".75"/>
    <g fill="url(#gold)" stroke="#9a6823" stroke-width=".6">
      <path d="m240 3 6 18 18 6-18 6-6 18-6-18-18-6 18-6Z"/><path d="m240 289 6 18 18 6-18 6-6 18-6-18-18-6 18-6Z"/>
      <path d="m73 170 5 14 14 5-14 5-5 14-5-14-14-5 14-5Z"/><path d="m407 170 5 14 14 5-14 5-5 14-5-14-14-5 14-5Z"/>
      <path d="m122 47 3 9 9 3-9 3-3 9-3-9-9-3 9-3Zm236 0 3 9 9 3-9 3-3 9-3-9-9-3 9-3Z"/>
    </g>
    <g fill="#b98632"><circle cx="102" cy="82" r="3"/><circle cx="378" cy="82" r="3"/><circle cx="102" cy="258" r="3"/><circle cx="378" cy="258" r="3"/><circle cx="240" cy="25" r="2.4"/><circle cx="240" cy="315" r="2.4"/></g>

    <!-- structura octogonală și canale -->
    <g fill="none">
      <path d="m240 34 96 40 40 96-40 96-96 40-96-40-40-96 40-96Z" stroke="#073f43" stroke-width="2.1"/>
      <path d="M240 34v272M104 170h272M144 74l192 192M336 74 144 266" stroke="#073f43" stroke-width="1.05" opacity=".8"/>
      <path d="M240 34 172 170l68 136 68-136ZM104 170l136-68 136 68-136 68Z" stroke="#b98632" stroke-width="1" stroke-dasharray="4 5"/>
      <path d="m144 74 96 28 96-28-28 96 28 96-96-28-96 28 28-96Z" stroke="#b98632" stroke-width=".75" opacity=".72"/>
    </g>

