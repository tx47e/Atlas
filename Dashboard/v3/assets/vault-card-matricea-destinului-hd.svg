      <circle cx="240" cy="87.5" r="55"/><circle cx="311.45" cy="128.75" r="55"/><circle cx="311.45" cy="211.25" r="55"/>
      <circle cx="240" cy="252.5" r="55"/><circle cx="168.55" cy="211.25" r="55"/><circle cx="168.55" cy="128.75" r="55"/>
      <path d="m240 60 95.26 55v110L240 280l-95.26-55V115Z" stroke-dasharray="4 4"/>
      <path d="m240 87.5 71.45 41.25v82.5L240 252.5l-71.45-41.25v-82.5Z"/>
