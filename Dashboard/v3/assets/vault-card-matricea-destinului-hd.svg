      <circle cx="240" cy="115" r="55"/><circle cx="287.63" cy="142.5" r="55"/><circle cx="287.63" cy="197.5" r="55"/>
      <circle cx="240" cy="225" r="55"/><circle cx="192.37" cy="197.5" r="55"/><circle cx="192.37" cy="142.5" r="55"/>
