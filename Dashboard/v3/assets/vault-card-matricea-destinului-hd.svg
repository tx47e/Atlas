    <g filter="url(#shadow)" fill="url(#node)" stroke="#073f43" stroke-width="2.2">
      <circle cx="240" cy="34" r="13"/><circle cx="336" cy="74" r="12"/><circle cx="376" cy="170" r="13"/><circle cx="336" cy="266" r="12"/>
      <circle cx="240" cy="306" r="13"/><circle cx="144" cy="266" r="12"/><circle cx="104" cy="170" r="13"/><circle cx="144" cy="74" r="12"/>
    </g>
    <g fill="url(#node)" stroke="#8b6d2b" stroke-width="1.6">
      <circle cx="240" cy="60" r="7"/><circle cx="335.26" cy="115" r="7"/><circle cx="335.26" cy="225" r="7"/>
      <circle cx="240" cy="280" r="7"/><circle cx="144.74" cy="225" r="7"/><circle cx="144.74" cy="115" r="7"/>
      <circle cx="240" cy="170" r="6"/>
