<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
  <title id="title">Matricea Destinului</title>
  <desc id="desc">Diagramă numerologică circulară cu opt noduri exterioare, centru și trasee energetice detaliate.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5d1c"/><stop offset=".48" stop-color="#d5b56d"/><stop offset="1" stop-color="#996621"/>
    </linearGradient>
    <radialGradient id="node" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#fffef8"/><stop offset=".75" stop-color="#fbf2df"/><stop offset="1" stop-color="#e9d09f"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#073f43" flood-opacity=".12"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="28" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComponentTransfer in="m" result="f"><feFuncA type="table" tableValues="0 .035"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="f" mode="multiply"/>
    </filter>
  </defs>

  <g filter="url(#grain)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Aureola -->
    <circle cx="240" cy="170" r="151" fill="none" stroke="#073f43" stroke-width="1.6" stroke-dasharray="2 8"/>
    <circle cx="240" cy="170" r="137" fill="none" stroke="#b98632" stroke-width=".85" stroke-dasharray="24 9 2 9"/>
    <circle cx="240" cy="170" r="118" fill="none" stroke="#b98632" stroke-opacity=".38" stroke-width=".75"/>
    <g fill="url(#gold)" stroke="#a47125" stroke-width=".7">
      <path d="M67 72c11 1 17 8 16 19-10 1-18-7-16-19Z"/><path d="M413 72c-11 1-17 8-16 19 10 1 18-7 16-19Z"/>
      <path d="M67 268c11-1 17-8 16-19-10-1-18 7-16 19Z"/><path d="M413 268c-11-1-17-8-16-19 10-1 18 7 16 19Z"/>
      <path d="M240 5c8 9 8 18 0 27-8-9-8-18 0-27ZM240 335c8-9 8-18 0-27-8 9-8 18 0 27Z"/>
    </g>
    <g fill="#b98632"><circle cx="71" cy="170" r="3"/><circle cx="409" cy="170" r="3"/><circle cx="120" cy="35" r="2.5"/><circle cx="360" cy="35" r="2.5"/><circle cx="120" cy="305" r="2.5"/><circle cx="360" cy="305" r="2.5"/></g>

    <!-- Schelet geometric -->
    <g fill="none">
      <path d="m240 24 103 43 45 103-45 103-103 43-103-43-45-103 45-103Z" stroke="#073f43" stroke-width="2.4"/>
      <path d="M240 24v292M92 170h296M137 67l206 206M343 67 137 273" stroke="#073f43" stroke-width="1.45"/>
      <path d="M240 24 178 170l62 146 62-146ZM92 170l148-67 148 67-148 67Z" stroke="#b98632" stroke-width="1.2" stroke-dasharray="4 5"/>
      <path d="M137 67 240 103l103-36-41 103 41 103-103-36-103 36 41-103Z" stroke="#b98632" stroke-width=".95"/>
      <path d="m137 67 41 103-41 103M343 67l-41 103 41 103M92 170l148-67 148 67-148 67Z" stroke="#073f43" stroke-opacity=".5" stroke-width=".75"/>
      <circle cx="240" cy="170" r="87" stroke="#b98632" stroke-width="1.1"/>
      <circle cx="240" cy="170" r="67" stroke="#b98632" stroke-opacity=".7" stroke-width=".8" stroke-dasharray="3 5"/>
      <circle cx="240" cy="170" r="49" stroke="#073f43" stroke-opacity=".55" stroke-width=".7"/>
    </g>

    <!-- Canale și săgeți -->
    <g fill="none" stroke-width="1.1">
      <path d="M137 67c37 28 58 63 62 103-4 40-25 75-62 103" stroke="#b98632"/>
      <path d="M343 67c-37 28-58 63-62 103 4 40 25 75 62 103" stroke="#b98632"/>
      <path d="M92 170c43-23 84-28 122-13M388 170c-43 23-84 28-122 13" stroke="#b98632"/>
      <path d="M182 110c17 15 28 35 32 58M298 110c-17 15-28 35-32 58M182 230c17-15 28-35 32-58M298 230c-17-15-28-35-32-58" stroke="#073f43" stroke-opacity=".55"/>
    </g>
    <g fill="url(#gold)" stroke="#9a6924" stroke-width=".55">
      <path d="m201 130 8 1-5 6Z"/><path d="m279 130-8 1 5 6Z"/><path d="m201 210 8-1-5-6Z"/><path d="m279 210-8-1 5-6Z"/>
    </g>

    <!-- Noduri secundare -->
    <g fill="url(#node)" stroke="#073f43" stroke-width="1.5">
      <circle cx="240" cy="103" r="8"/><circle cx="307" cy="170" r="8"/><circle cx="240" cy="237" r="8"/><circle cx="173" cy="170" r="8"/>
      <circle cx="193" cy="123" r="6"/><circle cx="287" cy="123" r="6"/><circle cx="287" cy="217" r="6"/><circle cx="193" cy="217" r="6"/>
    </g>
    <g fill="#b98632">
      <circle cx="240" cy="103" r="2"/><circle cx="307" cy="170" r="2"/><circle cx="240" cy="237" r="2"/><circle cx="173" cy="170" r="2"/>
    </g>

    <!-- Noduri majore -->
    <g filter="url(#shadow)" fill="url(#node)" stroke="#073f43" stroke-width="2.6">
      <circle cx="240" cy="24" r="28"/><circle cx="343" cy="67" r="24"/><circle cx="388" cy="170" r="24"/><circle cx="343" cy="273" r="24"/>
      <circle cx="240" cy="316" r="28"/><circle cx="137" cy="273" r="24"/><circle cx="92" cy="170" r="24"/><circle cx="137" cy="67" r="24"/>
      <circle cx="240" cy="170" r="34"/>
    </g>
    <circle cx="240" cy="170" r="27" fill="none" stroke="#b98632" stroke-width="1.5"/>
    <circle cx="240" cy="170" r="21" fill="none" stroke="#b98632" stroke-opacity=".4" stroke-width=".7"/>

    <g fill="#946623" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
      <text x="240" y="34" font-size="29">9</text><text x="343" y="76" font-size="24">7</text>
      <text x="388" y="179" font-size="24">6</text><text x="343" y="282" font-size="24">4</text>
      <text x="240" y="326" font-size="29">1</text><text x="137" y="282" font-size="24">8</text>
      <text x="92" y="179" font-size="24">3</text><text x="137" y="76" font-size="24">2</text>
      <text x="240" y="182" font-size="36">5</text>
    </g>

    <!-- Marcaje simbolice -->
    <g fill="none" stroke="#b98632">
      <path d="M99 91c15-8 28-8 41 0M340 91c15-8 28-8 41 0M99 249c15 8 28 8 41 0M340 249c15 8 28 8 41 0" stroke-width=".9"/>
      <path d="m110 93 4-9 4 9M362 93l4-9 4 9M110 247l4 9 4-9M362 247l4 9 4-9" stroke-width=".7"/>
      <path d="M63 112c10-7 19-4 23 7-11 3-19 0-23-7ZM417 112c-10-7-19-4-23 7 11 3 19 0 23-7ZM63 228c10 7 19 4 23-7-11-3-19 0-23 7ZM417 228c-10 7-19 4-23-7 11-3 19 0 23 7Z" fill="#d8b76d" fill-opacity=".22" stroke-width=".9"/>
      <path d="M66 115c7 0 13 2 18 6M414 115c-7 0-13 2-18 6M66 225c7 0 13-2 18-6M414 225c-7 0-13-2-18-6" stroke-width=".55"/>
    </g>

    <!-- Puncte de ritm -->
    <g fill="#d2ad60">
      <circle cx="218" cy="73" r="2"/><circle cx="262" cy="73" r="2"/><circle cx="337" cy="145" r="2"/><circle cx="337" cy="195" r="2"/>
      <circle cx="262" cy="267" r="2"/><circle cx="218" cy="267" r="2"/><circle cx="143" cy="195" r="2"/><circle cx="143" cy="145" r="2"/>
    </g>
  </g>
</svg>
