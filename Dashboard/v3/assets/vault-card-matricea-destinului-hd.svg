    <g fill="#b98632"><circle cx="240" cy="34" r="3"/><circle cx="336" cy="74" r="2.5"/><circle cx="376" cy="170" r="3"/><circle cx="336" cy="266" r="2.5"/><circle cx="240" cy="306" r="3"/><circle cx="144" cy="266" r="2.5"/><circle cx="104" cy="170" r="3"/><circle cx="144" cy="74" r="2.5"/></g>

    <!-- linii fine, săgeți și semne -->
    <g fill="none" stroke="#b98632" stroke-width=".7" opacity=".8">
      <path d="M125 99c12-7 24-7 36 0M319 99c12-7 24-7 36 0M125 241c12 7 24 7 36 0M319 241c12 7 24 7 36 0"/>
      <path d="m134 101 4-9 4 9m204 0-4-9-4 9M134 239l4 9 4-9m204 0-4 9-4-9"/>
      <path d="M83 126c11-5 20-1 25 10-11 4-20 0-25-10Zm314 0c-11-5-20-1-25 10 11 4 20 0 25-10ZM83 214c11 5 20 1 25-10-11-4-20 0-25 10Zm314 0c-11 5-20 1-25-10 11-4 20 0 25 10Z" fill="#d8b76d" fill-opacity=".16"/>
    </g>
  </g>
</svg>
