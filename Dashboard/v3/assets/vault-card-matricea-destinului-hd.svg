      <path d="M240 170c26-17 31-45 16-67-24 9-32 37-16 67Z" stroke-width="1.2"/>
      <path d="M240 170c26 17 31 45 16 67-24-9-32-37-16-67Z" stroke-width="1.2"/>
      <path d="M240 170c-26 17-31 45-16 67 24-9 32-37 16-67Z" stroke-width="1.2"/>
      <path d="M240 170c-17-26-45-31-67-16 9 24 37 32 67 16ZM240 170c17-26 45-31 67-16-9 24-37 32-67 16Z" stroke-width="1.2"/>
      <path d="M240 170c-17 26-45 31-67 16 9-24 37-32 67-16ZM240 170c17 26 45 31 67 16-9-24-37-32-67-16Z" stroke-width="1.2"/>
      <circle cx="240" cy="170" r="21" stroke-width="1.35"/><circle cx="240" cy="170" r="9" stroke-width=".8"/>
