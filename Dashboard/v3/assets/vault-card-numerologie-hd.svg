<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
  <title id="title">Pătratul lui Pitagora</title>
  <desc id="desc">Pătrat numerologic ornamental. Coloanele conțin, în ordine, 1 2 3, 4 5 6 și 7 8 9.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5d1c"/>
      <stop offset=".45" stop-color="#d2ad60"/>
      <stop offset="1" stop-color="#9a6a25"/>
    </linearGradient>
    <radialGradient id="paper" cx=".42" cy=".34" r=".8">
      <stop offset="0" stop-color="#fffdf5" stop-opacity=".92"/>
      <stop offset=".72" stop-color="#f7ecd4" stop-opacity=".48"/>
      <stop offset="1" stop-color="#ead5aa" stop-opacity=".22"/>
    </radialGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded"><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#173f41" flood-opacity=".13"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <circle cx="240" cy="169" r="144" fill="none" stroke="#0a5458" stroke-width="1.4" stroke-dasharray="2 8"/>
    <circle cx="240" cy="169" r="126" fill="none" stroke="#b98632" stroke-width="1.2" stroke-dasharray="20 7 2 7"/>
    <circle cx="240" cy="169" r="111" fill="none" stroke="#b98632" stroke-opacity=".42" stroke-width=".8"/>

    <g fill="none" stroke="url(#gold)" stroke-linecap="round">
      <path d="M97 92c-31 13-51 38-60 67M383 92c31 13 51 38 60 67M97 247c-31-13-51-38-60-67M383 247c31-13 51-38 60-67" stroke-width="1.7"/>
      <path d="M75 112c-14 5-24 16-30 30M405 112c14 5 24 16 30 30M75 226c-14-5-24-16-30-30M405 226c14-5 24-16 30-30" stroke-width=".9" stroke-dasharray="3 5"/>
    </g>

    <g fill="url(#gold)" stroke="#a8772b" stroke-width=".6">
      <path d="m240 6 7 20 20 7-20 7-7 20-7-20-20-7 20-7Z"/>
      <path d="m240 280 7 20 20 7-20 7-7 20-7-20-20-7 20-7Z"/>
      <path d="m77 169 6 17 17 6-17 6-6 17-6-17-17-6 17-6Z"/>
      <path d="m403 169 6 17 17 6-17 6-6 17-6-17-17-6 17-6Z"/>
      <path d="m113 49 3 9 9 3-9 3-3 9-3-9-9-3 9-3ZM367 49l3 9 9 3-9 3-3 9-3-9-9-3 9-3Z"/>
      <path d="m113 268 3 9 9 3-9 3-3 9-3-9-9-3 9-3Zm254 0 3 9 9 3-9 3-3 9-3-9-9-3 9-3Z"/>
    </g>
    <g fill="#b98632">
      <circle cx="81" cy="69" r="3"/><circle cx="399" cy="69" r="3"/>
      <circle cx="81" cy="269" r="3"/><circle cx="399" cy="269" r="3"/>
      <circle cx="43" cy="169" r="2.2"/><circle cx="437" cy="169" r="2.2"/>
    </g>

    <g filter="url(#softShadow)">
      <rect x="111" y="45" width="258" height="248" rx="17" fill="url(#paper)" stroke="#073f43" stroke-width="4"/>
      <rect x="120" y="54" width="240" height="230" rx="10" fill="none" stroke="#b98632" stroke-width="1.7"/>
      <rect x="128" y="62" width="224" height="214" rx="5" fill="#fffdf8" fill-opacity=".44" stroke="#b98632" stroke-opacity=".52" stroke-width=".8"/>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M128 133.33h224M128 204.66h224M202.66 62v214M277.33 62v214" stroke="#073f43" stroke-width="2.5"/>
      <path d="M132 137.33h216M132 208.66h216M206.66 66v206M281.33 66v206" stroke="#b98632" stroke-opacity=".24" stroke-width=".8"/>
      <path d="M128 89c20-10 36-10 56 0M296 89c20-10 36-10 56 0M128 249c20 10 36 10 56 0M296 249c20 10 36 10 56 0" stroke="#b98632" stroke-opacity=".36" stroke-width=".8"/>
    </g>

    <g fill="url(#gold)" stroke="#9a6a25" stroke-width=".7">
      <path d="m121 54 8 3 3 8 3-8 8-3-8-3-3-8-3 8Z"/>
      <path d="m337 54 8 3 3 8 3-8 8-3-8-3-3-8-3 8Z"/>
      <path d="m121 284 8-3 3-8 3 8 8 3-8 3-3 8-3-8Z"/>
      <path d="m337 284 8-3 3-8 3 8 8 3-8 3-3 8-3-8Z"/>
    </g>

    <g fill="#9c6e2b" font-family="Georgia, 'Times New Roman', serif" font-size="48" text-anchor="middle">
      <text x="165.3" y="116">1</text><text x="240" y="116">4</text><text x="314.7" y="116">7</text>
      <text x="165.3" y="188">2</text><text x="240" y="188">5</text><text x="314.7" y="188">8</text>
      <text x="165.3" y="260">3</text><text x="240" y="260">6</text><text x="314.7" y="260">9</text>
    </g>
    <g fill="none" stroke="#d2ad60" stroke-width=".75" opacity=".48">
      <ellipse cx="165.3" cy="98" rx="24" ry="28"/><ellipse cx="240" cy="98" rx="24" ry="28"/><ellipse cx="314.7" cy="98" rx="24" ry="28"/>
      <ellipse cx="165.3" cy="170" rx="24" ry="28"/><ellipse cx="240" cy="170" rx="24" ry="28"/><ellipse cx="314.7" cy="170" rx="24" ry="28"/>
      <ellipse cx="165.3" cy="242" rx="24" ry="28"/><ellipse cx="240" cy="242" rx="24" ry="28"/><ellipse cx="314.7" cy="242" rx="24" ry="28"/>
    </g>
    <!-- dantelă fină și trasee numerologice suplimentare -->
    <g fill="none" stroke="#b98632" stroke-linecap="round" stroke-linejoin="round">
      <path d="M111 91c-18-6-28-18-31-36 18 2 29 14 31 36Zm258 0c18-6 28-18 31-36-18 2-29 14-31 36ZM111 247c-18 6-28 18-31 36 18-2 29-14 31-36Zm258 0c18 6 28 18 31 36-18-2-29-14-31-36Z" stroke-width=".72" opacity=".58"/>
      <path d="M83 57c9 1 15 6 18 15M397 57c-9 1-15 6-18 15M83 281c9-1 15-6 18-15M397 281c-9-1-15-6-18-15" stroke-width=".55" stroke-dasharray="2 4" opacity=".75"/>
      <path d="M240 25c-29 7-52 22-70 44M240 25c29 7 52 22 70 44M240 313c-29-7-52-22-70-44M240 313c29-7 52-22 70-44" stroke-width=".6" stroke-dasharray="3 5" opacity=".5"/>
      <path d="M130 64c8 0 14 6 14 14 0 6-5 10-10 8-5-3-3-10 2-10M350 64c-8 0-14 6-14 14 0 6 5 10 10 8 5-3 3-10-2-10M130 274c8 0 14-6 14-14 0-6-5-10-10-8-5 3-3 10 2 10M350 274c-8 0-14-6-14-14 0-6 5-10 10-8 5 3 3 10-2 10" stroke-width=".7"/>
    </g>
    <g fill="#b98632" opacity=".5"><circle cx="154" cy="42" r="1.4"/><circle cx="326" cy="42" r="1.4"/><circle cx="154" cy="296" r="1.4"/><circle cx="326" cy="296" r="1.4"/></g>
  </g>
</svg>
